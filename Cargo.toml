[package]
name = "mcglue"
version = "0.1.12"
edition = "2024"
license = "MPL-2.0"
homepage = "https://github.com/Vonr/mcglue"
repository = "https://github.com/Vonr/mcglue"

[dependencies]
async-signal = "0.2"
bstr = "1"
btoi = "0.5"
chumsky = "0.13"
color-eyre = "0.6"
dotenvy = "0.15"
eyre = "0.6"
flate2 = "1"
flume = "0.12"
jaq-core = "3"
jaq-std = "3"
menv = "0.2"
nbtq-core = { git = "https://github.com/Vonr/nbtq", version = "0.1.1" }
crab_nbt = { git = "https://github.com/Vonr/CrabNBT.git", branch = "nbtq", features = ["serde"] }
parking_lot = "0.12"
poise = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "rustls", "system-proxy", "json"] }
rustyline = "18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "parking_lot", "process", "rt-multi-thread"] }
uuid = { version = "1", features = ["v3", "v4"] }
walkdir = "2"
zip = "9.0.0-pre3"
version-compare = "0.2"
dashbeam-engine = { package = "engine", git = "https://github.com/tonyantony300/dashbeam", rev = "ccc1eb8bcf1ee7d30cd2a85f1409edd46eac4b77" }
iroh = "1"
# console-subscriber = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
debug = 0
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-fmt = "zip"
